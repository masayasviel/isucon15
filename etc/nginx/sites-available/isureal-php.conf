# PHP 実装のアプリ（:8080）。isureal.conf の :80 から転送され、FastCGI で php-fpm に渡す。
# Go 実装と同じ :8080 を使うので、isureal-go を止めてから sites-enabled に入れる
server {
  listen 127.0.0.1:8080;
  root /home/isucon/webapp/php/public;
  client_max_body_size 64m;

  location = /api/notifications {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/notifications.php;
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_buffering off;
    fastcgi_read_timeout 1h;
  }

  location / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass 127.0.0.1:9000;
  }
}
